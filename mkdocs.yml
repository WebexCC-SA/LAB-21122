---
site_name: "LAB-21122: Exploring the Webex Developer Ecosystem"# This must begin with the session ID, e.g. LABXXX-1234 This is my Cisco Live Lab
site_description: "LAB-21122: Exploring the Webex Developer Ecosystem"  
site_author: Diego Manuel Jimenez Moreno
copyright: Copyright &copy; 2026 Cisco
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.integrate
  custom_dir: docs/overrides
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: template_assets/webexLogo91.png
  favicon: template_assets/webex75.png
extra:
  generator: false
  repo: "https://github.com/WebexCC-SA/LAB-21122.git"
  site_event: test
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - template_assets/js/newLoad.js
  - template_assets/js/setInfo.js
plugins:
  - search
  - macros
  # - with-pdf:
  #     cover_title: LABXXX-1234
  #     cover_subtitle: My famous WebexOne Lab
  #     cover_logo: template_assets/wx1Splash_new.gif
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      skip_classes:
      - custom-skip-class-name
      auto_caption: true
      caption_position: top
markdown_extensions:
  - md_in_html
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
      
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Lab:
      - Welcome: welcome.md
      - Overview: overview.md
      - Lab 1 - Getting Started: lab1_getting_started.md
      - Lab 2 - Making Your First API Requests: lab2_making-your-first-api-requests.md
      - Lab 3 - Creating an Integration: lab3_creating-an-integration.md
      - Lab 4 - Building a Bot: lab4_building-a-bot.md
      - Lab 5 - Deploying a Meeting Scheduler Service App: lab5_deploying-a-meeting-scheduler-service-app.md
      - Lab 6 - Use Cases: lab6_use-cases.md
      - Lab 7 - Troubleshooting: lab7_troubleshooting.md
      - Conclusion: conclusion.md